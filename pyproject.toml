[project]
name = "mayele-python-academie"
version = "0.1.0"
description = "Mayele Python Académie : formation complète à Python, des bases à l'expertise (Congo-Brazzaville)"
requires-python = ">=3.13"

# ---------------------------------------------------------------------------
# Ruff : linter + formatter (remplace flake8, isort, pyupgrade, etc.)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv", ".venv", "**/migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle erreurs
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (tri des imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade (syntaxe moderne)
    "B",    # flake8-bugbear (pièges courants)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # pathlib plutôt que os.path
    "RUF",  # règles spécifiques à ruff
]
ignore = ["E501"]  # la longueur de ligne est gérée par le formatter

[tool.ruff.lint.per-file-ignores]
"**/solutions/**" = ["SIM110", "SIM108", "SIM103", "SIM105", "SIM102", "RUF007"]  # boucles et if explicites : choix pédagogique
"**/solutions/test_sol*.py" = ["I001"]  # fichiers générés par outils/sync_tests_solutions.py
"parcours/p01_python_fondamentaux/**" = ["PTH123"]  # open() est enseigné avant pathlib
"**/projets/**" = ["SIM110", "SIM108", "SIM103", "SIM105", "SIM102", "RUF007"]
"**/exercices/**" = ["F401", "F841", "SIM103", "SIM110", "SIM108", "B006", "RET505"]  # imports/variables inutilisés tolérés dans les squelettes d'exercices

# ---------------------------------------------------------------------------
# Black : formatage (utilisé en complément du formatter ruff sur certains modules)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py313"]

# ---------------------------------------------------------------------------
# Mypy : vérification statique de types stricte
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
# Le typage est enseigné en P03 : mypy ne vérifie pas les parcours débutants (P01, P02).
exclude = ["venv", ".venv", "solutions", "parcours/p01_python_fondamentaux", "parcours/p02_poo_et_conception"]

[[tool.mypy.overrides]]
module = "exercices.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
python_functions = "test_*"  # ne collecte pas les fonctions tests_pour_* (exercices de la leçon 10.2)
# Par défaut on teste les SOLUTIONS (elles doivent toujours être vertes).
# Les exercices sont lancés explicitement par l'apprenant : pytest parcours/<parcours>/exercices/test_exNN_x.py
testpaths = ["parcours/*/solutions", "parcours/*/projets"]
markers = [
    "slow: tests lents (désactivés par défaut en dev)",
    "integration: tests d'intégration nécessitant une ressource externe (DB, réseau)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
omit = ["*/venv/*", "*/exercices/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
